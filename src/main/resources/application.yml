spring:
  application:
    name: medicycle

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medicycle?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 24h
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}

medicycle:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
  seed-demo: ${SEED_DEMO:true}

logging:
  level:
    com.medicycle: INFO
    org.springframework.security: INFO
